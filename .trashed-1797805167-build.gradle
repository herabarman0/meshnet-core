subprojects {
    apply plugin: 'java'
    repositories { mavenCentral() }
    java {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    }
    test { useJUnitPlatform() }
}
